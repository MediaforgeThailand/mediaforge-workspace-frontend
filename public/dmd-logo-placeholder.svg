<?xml version="1.0" encoding="UTF-8"?>
<!--
  DMD logo placeholder — swap with the real PNG once design supplies it.
  Vite serves this at /dmd-logo-placeholder.svg. The seed script and
  the `org_domains` mapping reference the file path; replacing the
  asset in /public is enough to update both the sidebar and the
  login screen brand.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3D8E"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="40" fill="url(#bg)"/>
  <text
    x="128" y="118"
    text-anchor="middle"
    font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-weight="800"
    font-size="68"
    fill="#fff"
    letter-spacing="2">DMD</text>
  <text
    x="128" y="160"
    text-anchor="middle"
    font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-size="14"
    fill="#fff"
    fill-opacity="0.85"
    letter-spacing="1.5">DIGITAL MEDIA DESIGN</text>
  <text
    x="128" y="200"
    text-anchor="middle"
    font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-size="10"
    fill="#fff"
    fill-opacity="0.6"
    letter-spacing="1">PLACEHOLDER · REPLACE ME</text>
</svg>
