  <body>
    <div id="root"></div>
    <!-- model-viewer is now lazy-loaded from src/lib/loadModelViewer.ts
         the first time a 3D preview is opened. Removed the eager CDN
         <script type="module"> tag that used to live here so the 280 KB
         module-viewer bundle no longer blocks first paint on every
         page. The dynamic loader still imports the same Google CDN
         build for the customElements.define side-effect. -->
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        var s = document.createElement('script');
        s.src = 'https://mcp.figma.com/mcp/html-to-design/capture.js';
        s.async = true;
        document.body.appendChild(s);
      }
    </script>
